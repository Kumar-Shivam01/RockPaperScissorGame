<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body{
      margin: 0;
      background: radial-gradient(1000px 500px at 50% 0%, #222 0%, #000 60%);
      color: #f6f6f6;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .container{
      width: 92%;
      max-width: 720px;
      padding: 32px 24px;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      background-color: #121212;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .game-name{
      font-size: 34px;
      font-weight: bold;
      letter-spacing: .5px;
      margin: 0 0 12px 0;
    }
    .subtitle{
      margin: 0 0 24px 0;
      color: #bdbdbd;
      font-size: 14px;
    }
    .buttons{
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .move-icon{
      height: 56px;
      width: 56px;
      pointer-events: none;
      user-select: none;
    }
    .move-buttons{
      background-color: #1a1a1a;
      border: 2px solid #3a3a3a;
      width: 110px;
      height: 110px;
      border-radius: 60px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background-color .12s ease;
      box-shadow: 0 4px 0 rgba(255,255,255,0.08);
    }
    .move-buttons:hover{
      transform: translateY(-2px);
      border-color: #6ee7ff;
      background-color: #222;
      box-shadow: 0 8px 14px rgba(110,231,255,0.15);
    }
    .move-buttons:active{
      transform: translateY(0);
      box-shadow: none;
    }
    .result{
      font-size: 22px;
      font-weight: bold;
      margin-top: 28px;
    }
    .score{
      margin-top: 12px;
      background: #0c0c0c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 10px 12px;
      display: inline-block;
      font-size: 15px;
    }
    .moves-row{
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d1d1d1;
    }
    .move-iconx{
      height: 28px;
      width: 28px;
    }
    .reset-row{
      margin-top: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .reset-score-button{
      background-color: #ffffff;
      color: #111;
      border: none;
      font-size: 15px;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .reset-score-button:hover{
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(255,255,255,0.2);
    }
    .hint{
      color: #9a9a9a;
      font-size: 13px;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock paper scissors</title>
</head>
<body>
  <div class="container">
    <p class="game-name">Rock Paper Scissors</p>
    <p class="subtitle">Choose your move below. Keyboard: R, P, S</p>

    <div class="buttons" role="group" aria-label="Move selection">
      <button onclick="playGame('Rock')" class="move-buttons" aria-label="Play Rock">
        <img src="fist.png" class="move-icon" alt="Rock">
      </button>
      <button onclick="playGame('Paper')" class="move-buttons" aria-label="Play Paper">
        <img src="palm.png" class="move-icon" alt="Paper">
      </button>
      <button onclick="playGame('Scissors')" class="move-buttons" aria-label="Play Scissors">
        <img src="victory.png" class="move-icon" alt="Scissors">
      </button>
    </div>

    <p class="js-result result" aria-live="polite"></p>

    <div class="moves-row js-move" aria-live="polite"></div>

    <p class="js-score score"></p>

    <div class="reset-row">
      <button onclick="resetScore()" class="reset-score-button">Reset Score</button>
      <span class="hint">Tip: Use keyboard shortcuts R, P, S</span>
    </div>
  </div>

  <script>
    let score = { Wins: 0, Loses: 0, Ties: 0 };
    const savedScore = localStorage.getItem('score');
    if(savedScore){
      try{
        const parsed = JSON.parse(savedScore);
        if(parsed && typeof parsed === 'object'){
          score.Wins = Number(parsed.Wins) || 0;
          score.Loses = Number(parsed.Loses) || 0;
          score.Ties = Number(parsed.Ties) || 0;
        }
      }catch(e){
        localStorage.removeItem('score');
      }
    }
    const resultEl = document.querySelector('.js-result');
    const moveEl = document.querySelector('.js-move');
    const scoreEl = document.querySelector('.js-score');
    const icons = { Rock: 'fist.png', Paper: 'palm.png', Scissors: 'victory.png' };

    updateScoreElement();

    function playGame(playerMove){
      const computerMove = pickComputermove();
      let result = '';
      if(playerMove === 'Rock'){
        if(computerMove === 'Rock'){result = 'Tie';}
        else if(computerMove === 'Paper'){result = 'You lose';}
        else {result = 'You win';}
      } else if(playerMove === 'Paper'){
        if(computerMove === 'Rock'){result = 'You win';}
        else if(computerMove === 'Paper'){result = 'Tie';}
        else {result = 'You lose';}
      } else {
        if(computerMove === 'Rock'){result = 'You lose';}
        else if(computerMove === 'Paper'){result = 'You win';}
        else {result = 'Tie';}
      }

      if(result === 'You win'){ score.Wins += 1; }
      else if(result === 'You lose'){ score.Loses += 1; }
      else { score.Ties += 1; }

      localStorage.setItem('score', JSON.stringify(score));
      updateScoreElement();
      resultEl.innerHTML = result;
      moveEl.innerHTML = `
        <span>You</span>
        <img src="${icons[playerMove]}" class="move-iconx" alt="${playerMove}">
        <span>vs</span>
        <img src="${icons[computerMove]}" class="move-iconx" alt="${computerMove}">
        <span>Computer</span>
      `;
    }

    function updateScoreElement(){
      scoreEl.innerHTML = `Wins: ${score.Wins} &nbsp;&nbsp; Loses: ${score.Loses} &nbsp;&nbsp; Ties: ${score.Ties}`;
    }

    function pickComputermove(){
      const randomNumber = Math.random();
      if(randomNumber < 1/3) return 'Rock';
      if(randomNumber < 2/3) return 'Paper';
      return 'Scissors';
    }

    function resetScore(){
      score.Wins = 0; score.Loses = 0; score.Ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
      resultEl.innerHTML = '';
      moveEl.innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if(key === 'r') playGame('Rock');
      else if(key === 'p') playGame('Paper');
      else if(key === 's') playGame('Scissors');
    });
    
  </script>
  
</body>
</html>
